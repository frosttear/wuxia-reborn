<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的页面 | My Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: 8px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            color: #fff;
        }

        .lang-btn.active {
            background: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 12px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div></div>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="zh" onclick="setLang('zh')">中文</button>
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>

        <h1 data-i18n="title">我的页面</h1>
        <p class="subtitle" data-i18n="subtitle">演示、游戏和演示文稿合集</p>
        
        <div class="card-grid">
            <a href="async-await-thread-pitfall.html" class="card">
                <div class="card-icon">📊</div>
                <div class="card-title" data-i18n="async_title">Async/Await 线程切换陷阱</div>
                <div class="card-description" data-i18n="async_desc">一个关于 async/await 和线程切换常见陷阱的交互式演示文稿。</div>
                <span class="tag" data-i18n="tag_presentation">演示文稿</span>
            </a>

            <a href="Baseball.html" class="card">
                <div class="card-icon">⚾</div>
                <div class="card-title" data-i18n="baseball_title">棒球</div>
                <div class="card-description" data-i18n="baseball_desc">使用 Scratch 制作并通过 TurboWarp 打包的有趣棒球游戏。</div>
                <span class="tag" data-i18n="tag_game">游戏</span>
            </a>

            <a href="FlyingBird_mobile.html" class="card">
                <div class="card-icon">🐦</div>
                <div class="card-title" data-i18n="bird_title">飞翔的小鸟</div>
                <div class="card-description" data-i18n="bird_desc">适配移动端的飞翔小鸟游戏，点击屏幕即可飞行！</div>
                <span class="tag" data-i18n="tag_game">游戏</span>
            </a>

            <a href="fox-demon-battle-preview.html" class="card">
                <div class="card-icon">🦊</div>
                <div class="card-title" data-i18n="foxdemon_title">狐妖大作战</div>
                <div class="card-description" data-i18n="foxdemon_desc">类似植物大战僵尸的塔防游戏，部署防御抵御敌人入侵！</div>
                <span class="tag" data-i18n="tag_game">游戏</span>
            </a>

            <a href="grade3-typing-practice.html" class="card">
                <div class="card-icon">⌨️</div>
                <div class="card-title" data-i18n="typing_title">三年级英语打字练习</div>
                <div class="card-description" data-i18n="typing_desc">英语单词打字练习游戏，10秒内输入正确单词得分，共10题。</div>
                <span class="tag" data-i18n="tag_education">教育</span>
            </a>
        </div>

        <footer data-i18n="footer">托管于 GitHub Pages</footer>
    </div>

    <script>
        const i18n = {
            zh: {
                title: '我的页面',
                subtitle: '演示、游戏和演示文稿合集',
                async_title: 'Async/Await 线程切换陷阱',
                async_desc: '一个关于 async/await 和线程切换常见陷阱的交互式演示文稿。',
                baseball_title: '棒球',
                baseball_desc: '使用 Scratch 制作并通过 TurboWarp 打包的有趣棒球游戏。',
                bird_title: '飞翔的小鸟',
                bird_desc: '适配移动端的飞翔小鸟游戏，点击屏幕即可飞行！',
                foxdemon_title: '狐妖大作战',
                foxdemon_desc: '类似植物大战僵尸的塔防游戏，部署防御抵御敌人入侵！',
                typing_title: '三年级英语打字练习',
                typing_desc: '英语单词打字练习游戏，显示单词和中文释义，10秒内输入正确单词得分，共10题。',
                tag_presentation: '演示文稿',
                tag_game: '游戏',
                tag_education: '教育',
                footer: '托管于 GitHub Pages'
            },
            en: {
                title: 'My Pages',
                subtitle: 'A collection of demos, games, and presentations',
                async_title: 'Async/Await Thread Switching Pitfall',
                async_desc: 'An interactive presentation about common pitfalls when working with async/await and thread switching.',
                baseball_title: 'Baseball',
                baseball_desc: 'A fun baseball game built with Scratch and packaged with TurboWarp.',
                bird_title: 'Flying Bird',
                bird_desc: 'A mobile-friendly Flappy Bird style game. Tap to fly!',
                foxdemon_title: 'Fox Demon Battle',
                foxdemon_desc: 'A Plants vs Zombies style tower defense game. Deploy defenses to stop the invaders!',
                typing_title: 'Grade 3 English Typing Practice',
                typing_desc: 'English vocabulary typing game. Type the correct word within 10 seconds to score. 10 words total.',
                tag_presentation: 'Presentation',
                tag_game: 'Game',
                tag_education: 'Education',
                footer: 'Hosted on GitHub Pages'
            }
        };

        function setLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });

            localStorage.setItem('lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang') || 'zh';
            setLang(savedLang);
        });
    </script>
</body>
</html>
