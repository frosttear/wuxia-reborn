<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf4ff 100%);
            color: #1e1e3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 8px 40px rgba(108, 80, 200, 0.12);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560 0%, #7c4dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lang-toggle {
            display: flex;
            border: 1.5px solid #d0c8f0;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lang-btn {
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #9090b0;
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #e94560, #7c4dff);
            color: #fff;
        }

        .lang-btn:not(.active):hover {
            background: #f0eeff;
            color: #5c40cc;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #7070a0;
            margin-bottom: 7px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 11px 14px;
            background-color: #f7f8fd;
            color: #1e1e3a;
            border: 1.5px solid #dcdcf0;
            border-radius: 6px;
            font-size: 14px;
            font-family: "Segoe UI", sans-serif;
            transition: border-color 0.25s, background 0.25s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #e94560;
            background-color: #fff;
        }

        input::placeholder,
        textarea::placeholder {
            color: #b0b0c8;
        }

        textarea {
            resize: vertical;
            min-height: 140px;
            font-family: "Segoe UI", sans-serif;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            border: 1.5px solid #d0c8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-right: 1px solid #d0c8f0;
            background: transparent;
            color: #9090b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            line-height: 1.3;
        }

        .mode-btn:last-child {
            border-right: none;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #e94560, #7c4dff);
            color: #fff;
        }

        .mode-btn:not(.active):hover {
            background: #f0eeff;
            color: #5c40cc;
        }

        .tool-tabs {
            display: flex;
            border: 1.5px solid #d0c8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .tool-tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-right: 1px solid #d0c8f0;
            background: transparent;
            color: #9090b0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .tool-tab-btn:last-child {
            border-right: none;
        }

        .tool-tab-btn.active {
            background: linear-gradient(135deg, #e94560, #7c4dff);
            color: #fff;
        }

        .tool-tab-btn:not(.active):hover {
            background: #f0eeff;
            color: #5c40cc;
        }

        /* Lyrics section */
        .lyrics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .lyrics-header label {
            margin: 0;
        }

        .lyrics-gen-btn {
            padding: 5px 14px;
            background: linear-gradient(135deg, #16c79a 0%, #0ea57e 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(22, 199, 154, 0.25);
            transition: opacity 0.2s, transform 0.15s;
        }

        .lyrics-gen-btn:hover:not(:disabled) {
            opacity: 0.88;
        }

        .lyrics-gen-btn:not(:disabled):active {
            transform: scale(0.97);
        }

        .lyrics-gen-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Audio settings */
        .audio-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
            color: #7070a0;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .audio-toggle:hover {
            color: #5c40cc;
        }

        .toggle-arrow {
            font-size: 10px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .toggle-arrow.open {
            transform: rotate(90deg);
        }

        .audio-settings {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .audio-settings select {
            padding: 9px 10px;
            font-size: 13px;
        }

        /* Field error state */
        .field-error {
            border-color: #e94560 !important;
            background-color: rgba(233, 69, 96, 0.05) !important;
        }

        /* Generate button */
        .generate-btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px 20px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #e94560 0%, #c0304a 100%);
            color: white;
            box-shadow: 0 3px 14px rgba(233, 69, 96, 0.28);
            transition: opacity 0.25s, transform 0.15s, box-shadow 0.25s;
        }

        .generate-btn:hover:not(:disabled) {
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.40);
            opacity: 0.92;
        }

        .generate-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        .generate-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Status */
        .status {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 13px;
            min-height: 20px;
            display: flex;
            align-items: center;
        }

        .status.success {
            background-color: rgba(22, 199, 154, 0.12);
            color: #0c9e73;
            border: 1px solid rgba(22, 199, 154, 0.3);
        }

        .status.error {
            background-color: rgba(233, 69, 96, 0.1);
            color: #c82040;
            border: 1px solid rgba(233, 69, 96, 0.25);
        }

        .status.info {
            background-color: rgba(124, 77, 255, 0.09);
            color: #6030cc;
            border: 1px solid rgba(124, 77, 255, 0.2);
        }

        .status.loading {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(124, 77, 255, 0.09);
            color: #6030cc;
            border: 1px solid rgba(124, 77, 255, 0.2);
        }

        .progress-box {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(124, 77, 255, 0.2);
            background: rgba(124, 77, 255, 0.06);
        }

        .progress-text {
            font-size: 12px;
            color: #6030cc;
            margin-bottom: 7px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #e7e2ff;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #e94560 0%, #7c4dff 100%);
            transition: width 0.2s ease;
        }

        .progress-fill.processing {
            background-size: 26px 26px;
            background-image: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.25) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0.25) 75%,
                transparent 75%,
                transparent
            ), linear-gradient(135deg, #e94560 0%, #7c4dff 100%);
            animation: progressStripe 0.8s linear infinite;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(124, 77, 255, 0.25);
            border-top-color: #7c4dff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes progressStripe {
            from { background-position: 0 0, 0 0; }
            to { background-position: 26px 0, 0 0; }
        }

        /* History */
        .history-section {
            margin-top: 28px;
            border-top: 1.5px solid #ececf8;
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .history-title {
            font-size: 13px;
            font-weight: 600;
            color: #7070a0;
            letter-spacing: 0.02em;
        }

        .history-clear-btn {
            background: none;
            border: 1px solid #dcdcf0;
            border-radius: 5px;
            padding: 3px 10px;
            font-size: 12px;
            color: #9090b0;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .history-clear-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .history-empty {
            font-size: 13px;
            color: #b0b0c8;
            text-align: center;
            padding: 16px 0;
        }

        .history-item {
            background: #f7f8fd;
            border: 1.5px solid #ececf8;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }


        .history-item-meta {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
        }

        .history-item-prompt {
            font-size: 13px;
            color: #1e1e3a;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-time {
            font-size: 11px;
            color: #b0b0c8;
            flex-shrink: 0;
        }

        .history-expired-badge {
            font-size: 11px;
            font-weight: 600;
            color: #c08000;
            background: rgba(255, 180, 0, 0.12);
            border: 1px solid rgba(255, 180, 0, 0.35);
            border-radius: 4px;
            padding: 1px 6px;
            flex-shrink: 0;
        }

        .history-item.expired {
            opacity: 0.65;
        }

        .history-item.expired audio {
            pointer-events: none;
            filter: grayscale(1);
        }

        .history-item audio {
            width: 100%;
            height: 32px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .history-item-actions {
            display: flex;
            gap: 8px;
        }

        .history-action-btn {
            flex: 1;
            padding: 5px 0;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid;
            transition: opacity 0.2s;
            text-align: center;
        }

        .history-action-btn:hover { opacity: 0.75; }

        .history-action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-download {
            border-color: #7c4dff;
            color: #7c4dff;
            background: rgba(124, 77, 255, 0.06);
        }

        .btn-share {
            border-color: #16c79a;
            color: #0c9e73;
            background: rgba(22, 199, 154, 0.07);
        }

        .btn-share.copied {
            border-color: #16c79a;
            color: #fff;
            background: #16c79a;
        }


        @media (max-width: 600px) {
            .container {
                padding: 22px 18px;
            }

            .audio-settings {
                grid-template-columns: 1fr;
            }

            .mode-btn {
                font-size: 12px;
                padding: 9px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 data-i18n="title">Music Generator</h1>
            <div class="lang-toggle">
                <button class="lang-btn" id="btnEn" onclick="setLocale('en')">EN</button>
                <button class="lang-btn" id="btnZh" onclick="setLocale('zh')">中文</button>
            </div>
        </div>

        <div class="form-group">
            <label for="apiKey" data-i18n="apiKeyLabel">API Key:</label>
            <input type="text" id="apiKey" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Enter your Minimax API key">
        </div>

        <div class="form-group">
            <div class="tool-tabs">
                <button class="tool-tab-btn active" id="tabGenerate" onclick="setToolTab('generate')" data-i18n="tabGenerate">Music Generator</button>
                <button class="tool-tab-btn" id="tabLrcTool" onclick="setToolTab('lrc')" data-i18n="tabLrcTool">MP3 to LRC</button>
            </div>
        </div>

        <div id="generatePanel">

        <div class="form-group">
            <div class="lyrics-header">
                <label for="prompt" data-i18n="promptLabel">Prompt:</label>
                <button class="lyrics-gen-btn" style="background:linear-gradient(135deg,#7c4dff 0%,#5c30cc 100%);box-shadow:0 2px 8px rgba(124,77,255,0.25)" onclick="copyPrompt(this)" data-i18n="copyPromptBtn">Copy Prompt</button>
            </div>
            <textarea id="prompt" data-i18n-placeholder="promptPlaceholder" placeholder="Describe the music style you want to generate" style="min-height:80px"></textarea>
        </div>

        <div class="form-group">
            <label data-i18n="modeLabel">Mode:</label>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="auto" onclick="setMode('auto')" data-i18n="modeAuto">Auto Lyrics</button>
                <button class="mode-btn" data-mode="review" onclick="setMode('review')" data-i18n="modeReview">Edit Lyrics</button>
                <button class="mode-btn" data-mode="instrumental" onclick="setMode('instrumental')" data-i18n="modeInstrumental">Instrumental</button>
            </div>
        </div>

        <div class="form-group" id="lyricsSection" style="display:none">
            <div class="lyrics-header">
                <label for="lyrics" data-i18n="lyricsLabel">Lyrics:</label>
                <div style="display:flex;gap:8px">
                    <button class="lyrics-gen-btn" id="lyricsBtn" data-i18n="lyricsBtn">Generate Lyrics</button>
                    <button class="lyrics-gen-btn" style="background:linear-gradient(135deg,#7c4dff 0%,#5c30cc 100%);box-shadow:0 2px 8px rgba(124,77,255,0.25)" onclick="copyLyrics(this)" data-i18n="copyLyricsBtn">Copy Lyrics</button>
                </div>
            </div>
            <textarea id="lyrics" data-i18n-placeholder="lyricsPlaceholder" placeholder="Click 'Generate Lyrics' or type directly"></textarea>
        </div>

        <div class="form-group">
            <button class="audio-toggle" id="audioToggle" onclick="toggleAudio()">
                <span class="toggle-arrow" id="audioArrow">▶</span>
                <span data-i18n="audioSettings">Audio Settings</span>
            </button>
            <div class="audio-settings" id="audioPanel" style="display:none">
                <select id="sampleRate">
                    <option value="16000">16000 Hz</option>
                    <option value="24000">24000 Hz</option>
                    <option value="32000">32000 Hz</option>
                    <option value="44100" selected>44100 Hz</option>
                </select>
                <select id="bitrate">
                    <option value="32">32 kbps</option>
                    <option value="64">64 kbps</option>
                    <option value="128">128 kbps</option>
                    <option value="256" selected>256 kbps</option>
                </select>
                <select id="format">
                    <option value="mp3" selected>MP3</option>
                    <option value="wav">WAV</option>
                    <option value="pcm">PCM</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn" data-i18n="generateBtn">Generate Music</button>

        <div class="history-section" id="historySection" style="display:none">
            <div class="history-header">
                <span class="history-title" data-i18n="historyLabel">Generation History</span>
                <div style="display:flex;gap:6px">
                    <button class="history-clear-btn" id="btnClearExpired" onclick="clearExpired()" data-i18n="historyClearExpired">Clear Expired</button>
                    <button class="history-clear-btn" onclick="clearHistory()" data-i18n="historyClear">Clear History</button>
                </div>
            </div>
            <div id="historyList"></div>
        </div>

        </div>

        <div id="lrcToolPanel" style="display:none">
            <div class="form-group">
                <label for="lrcAudioUrl" data-i18n="lrcAudioUrlLabel">Audio URL (optional):</label>
                <input type="text" id="lrcAudioUrl" data-i18n-placeholder="lrcAudioUrlPlaceholder" placeholder="Paste generated MP3 URL">
            </div>

            <div class="form-group">
                <label for="lrcAudioFile" data-i18n="lrcAudioFileLabel">Or upload audio file:</label>
                <input type="file" id="lrcAudioFile" accept=".mp3,.wav,.m4a,.flac,.ogg,.aac,.webm,.mp4,audio/*" title="Supported: mp3, wav, m4a, flac, ogg, aac, webm, mp4">
            </div>

            <button class="generate-btn" id="analyzeLrcBtn" data-i18n="analyzeLrcBtn" style="margin-top:0">Generate LRC</button>

            <div class="progress-box" id="lrcProgressBox" style="display:none">
                <div class="progress-text">
                    <span id="lrcProgressLabel">-</span>
                    <span id="lrcProgressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="lrcProgressFill"></div>
                </div>
            </div>

            <div class="form-group" style="margin-top:16px">
                <label for="lrcOutput" data-i18n="lrcOutputLabel">LRC Preview:</label>
                <textarea id="lrcOutput" readonly style="min-height:180px" data-i18n-placeholder="lrcOutputPlaceholder" placeholder="LRC content will appear here"></textarea>
            </div>

            <div class="history-item-actions" style="margin-top:10px">
                <button class="history-action-btn btn-download" id="downloadLrcBtn" disabled data-i18n="historyDownloadLrc">Download LRC</button>
                <button class="history-action-btn btn-download" id="downloadJsonBtn" disabled data-i18n="downloadTimelineJson">Download Timeline JSON</button>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const translations = {

                title: 'Music Generator',

                apiKeyPlaceholder: 'Enter your Minimax API key',
                tabGenerate: 'Music Generator',

                promptPlaceholder: 'Describe the music style you want to generate',

                modeReview: 'Edit Lyrics',

                lyricsLabel: 'Lyrics:',
                lyricsPlaceholder: "Click 'Generate Lyrics' or type directly",
                audioSettings: 'Audio Settings',
                generateBtn: 'Generate Music',
                lyricsBtn: 'Generate Lyrics',
                copyPromptBtn: 'Copy Prompt',
                copyLyricsBtn: 'Copy Lyrics',
                errNoApiKey: 'Please enter API key',

                inProgress: 'Music generation in progress...',
                taskSubmitted: 'Task submitted: ',

                error: 'Error: ',
                historyLabel: 'Generation History',
                historyClear: 'Clear All',

                historyDownloadLrc: 'Download LRC',
                historyShare: 'Copy Link',
                historyCopied: 'Copied!',
                historyExpired: 'Expired',
                historyClearExpired: 'Clear Expired',
                historyLoadedPrompt: 'Loaded prompt from history.',
                historyLoadedPromptLyrics: 'Loaded prompt and lyrics from history.',
                historyLrcUnavailable: 'LRC not available for this song yet.',
                historyPreparingLrc: 'Preparing LRC...',
                historyLrcPrepareFailed: 'Failed to prepare LRC: ',
                lrcAudioUrlLabel: 'Audio URL (optional):',
                lrcAudioUrlPlaceholder: 'Paste generated MP3 URL',
                lrcAudioFileLabel: 'Or upload audio file:',
                analyzeLrcBtn: 'Generate LRC',
                lrcOutputLabel: 'LRC Preview:',

                downloadTimelineJson: 'Download Timeline JSON',
                errNeedAudioInput: 'Please provide an audio URL or upload an audio file.',

            zh: {

                apiKeyPlaceholder: '请输入您的 Minimax API 密钥',
                tabGenerate: '音乐生成器',
                tabLrcTool: 'MP3 转 LRC',
                promptLabel: '风格描述:',
                promptPlaceholder: '描述您想生成的音乐风格',
                copyLyricsBtn: '复制歌词',

                modeAuto: '自动生成歌词',
                modeReview: '预览并编辑歌词',
                modeInstrumental: '纯音乐',
                lyricsLabel: '歌词:',
                lyricsPlaceholder: '点击「生成歌词」，或直接输入',
                audioSettings: '音频设置',
                generateBtn: '生成音乐',
                lyricsBtn: '生成歌词',
                copyPromptBtn: '复制提示词',
                errNoApiKey: '请输入 API 密钥',

        function sanitizeFilenameBase(name) {

            const noExt = trimmed.replace(/\.[^.]+$/, '');

            return safe || `lrc_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')}`;
        }

        function inferBaseNameFromUrl(url) {

            } catch {
                return sanitizeFilenameBase('audio');
            }

        async function callApi(endpoint, payload, method = 'POST') {
            try {
                const fetchOptions = {
                    method,
                    keepalive: true,
                    headers: {
                        'Authorization': `Bearer ${realApiKey}`,
                        'Content-Type': 'application/json'
                    }
                };
                if (method !== 'GET' && payload !== undefined) {
                    fetchOptions.body = JSON.stringify(payload);
                }

                const response = await fetch(endpoint, fetchOptions);
                let data = {};
                try {
                    data = await response.json();
                } catch {
                    data = {};
                }
                return { success: response.ok, status: response.status, data, error: response.ok ? null : `HTTP ${response.status}` };
            } catch (err) {
                return { success: false, status: 0, error: err.message };
            }
        }

        function getApiErrorInfo(data, fallback = 'Unknown error') {
            const base = data?.base_resp || {};
            const statusCode = base.status_code;
            const statusMsg = base.status_msg || base.err_msg;
            const traceId = data?.trace_id || data?.data?.trace_id;
            const message = statusMsg || fallback;
            return {
                statusCode,
                traceId,
                message,
                detail: traceId ? `${message} (trace_id: ${traceId})` : message
            };
        }

        function createID3v2Tag(title, lyrics) {
            if (!lyrics) return null;
            
            const enc = new TextEncoder();
            const frames = [];
            
            const createTextFrame = (frameId, text) => {
                const textBytes = enc.encode(text);
                const frame = new Uint8Array(11 + textBytes.length);
                frame.set(enc.encode(frameId), 0);
                const size = 1 + textBytes.length;
                frame[4] = (size >> 8) & 0xFF;
                frame[5] = size & 0xFF;
                frame[6] = 0;
                frame[7] = 0;
                frame[8] = 0;
                frame[9] = 0;
                frame.set(textBytes, 10);
                return frame;
            };
            
            const createUSLTFrame = (lyrics) => {
                const lyricsBytes = enc.encode(lyrics);
                const contentSize = 4 + lyricsBytes.length + 1;
                const frame = new Uint8Array(10 + contentSize);
                frame.set(enc.encode('USLT'), 0);
                frame[4] = (contentSize >> 8) & 0xFF;
                frame[5] = contentSize & 0xFF;
                frame[6] = 0;
                frame[7] = 0;
                frame[8] = 0;
                frame[9] = 3;
                frame.set(enc.encode('eng\0'), 10);
                frame.set(lyricsBytes, 14);
                return frame;
            };
            
            frames.push(createTextFrame('TIT2', title || 'Generated Music'));
            frames.push(createTextFrame('TPE1', 'Music Generator'));
            frames.push(createUSLTFrame(lyrics));
            
            const frameData = frames.reduce((acc, frame) => acc.concat(Array.from(frame)), []);
            const frameBytes = new Uint8Array(frameData);
            
            const tagSize = frameBytes.length;
            const synchsafeSize = new Uint8Array([
                (tagSize >> 21) & 0x7F,
                (tagSize >> 14) & 0x7F,
                (tagSize >> 7) & 0x7F,
                tagSize & 0x7F
            ]);
            
            const id3Header = new Uint8Array(10);
            id3Header.set(enc.encode('ID3'), 0);
            id3Header[3] = 4;
            id3Header[4] = 0;
            id3Header[5] = 0;
            id3Header.set(synchsafeSize, 6);
            
            const tag = new Uint8Array(id3Header.length + frameBytes.length);
            tag.set(id3Header, 0);
            tag.set(frameBytes, id3Header.length);
            
            return tag;
        }

        function prependID3Tag(audioBuffer, title, lyrics) {
            const id3Tag = createID3v2Tag(title, lyrics);
            if (!id3Tag) return new Uint8Array(audioBuffer);
            
            const audioData = new Uint8Array(audioBuffer);
            let audioStart = 0;
            
            if (audioData.length > 3 && String.fromCharCode(audioData[0], audioData[1], audioData[2]) === 'ID3') {
                const size = ((audioData[6] & 0x7f) << 21) | ((audioData[7] & 0x7f) << 14) | ((audioData[8] & 0x7f) << 7) | (audioData[9] & 0x7f);
                audioStart = 10 + size;
            }
            
            const result = new Uint8Array(id3Tag.length + audioData.length - audioStart);
            result.set(id3Tag, 0);
            result.set(audioData.subarray(audioStart), id3Tag.length);
            
            return result;
        }

        function toLrcTimestamp(seconds) {
            const s = Number(seconds || 0);
            const mm = String(Math.floor(Math.max(0, s) / 60)).padStart(2, '0');
            const ss = String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0');
            const xx = String(Math.floor((Math.max(0, s) % 1) * 100)).padStart(2, '0');
            return `${mm}:${ss}.${xx}`;
        }

        function normalizeSectionLabel(label) {
            return String(label || '')
                .toLowerCase()
                .replace(/\[[^\]]*\]/g, '')
                .replace(/\d+/g, '')
                .replace(/[^a-z]/g, '');
        }

        function parseLyricsBlocks(formattedLyrics, fallbackLyrics) {
            const source = (formattedLyrics || fallbackLyrics || '').trim();
            if (!source) return [];
            const lines = source.split(/\r?\n/);
            const blocks = [];
            let current = null;

            for (const raw of lines) {
                const line = raw.trim();
                if (!line) continue;
                const tag = line.match(/^\[(.+?)\]$/);
                if (tag) {
                    if (current && current.lines.length) blocks.push(current);
                    current = { label: normalizeSectionLabel(tag[1]), lines: [] };
                } else {
                    if (!current) current = { label: 'verse', lines: [] };
                    current.lines.push(line);
                }
            }
            if (current && current.lines.length) blocks.push(current);
            return blocks;
        }

        function buildSimpleLrc(entry) {
            let structure = entry.structureResult;
            if (typeof structure === 'string') {
                try {
                    structure = JSON.parse(structure);
                } catch {
                    structure = null;
                }
            }

            const segments = Array.isArray(structure?.segments)
                ? structure.segments
                    .map(seg => ({
                        start: Number(seg.start || 0),
                        label: normalizeSectionLabel(seg.label)
                    }))
                    .sort((a, b) => a.start - b.start)
                : [];

            const blocks = parseLyricsBlocks(entry.formattedLyrics, entry.lyrics);
            if (!blocks.length) return '';

            const used = new Array(segments.length).fill(false);
            const lines = [
                `[ti:${entry.prompt || 'Generated Song'}]`,
                '[ar:MiniMax Music Generator]',
                '[by:music-generator]'
            ];

            if (!segments.length) {
                const total = Number(entry.audioDuration || 0);
                const step = blocks.length > 0
                    ? Math.max(6, total > 0 ? total / blocks.length : 10)
                    : 10;
                for (let i = 0; i < blocks.length; i++) {
                    const stamp = toLrcTimestamp(i * step);
                    lines.push(`[${stamp}]${blocks[i].lines.join(' / ')}`);
                }
                return lines.join('\n');
            }

            for (const block of blocks) {
                let idx = segments.findIndex((seg, i) => !used[i] && (seg.label === block.label || seg.label.startsWith(block.label) || block.label.startsWith(seg.label)));
                if (idx < 0) idx = used.findIndex(v => !v);
                if (idx < 0) break;
                used[idx] = true;
                lines.push(`[${toLrcTimestamp(segments[idx].start)}]${block.lines.join(' / ')}`);
            }

            return lines.join('\n');
        }

        function callApiWithXhr(endpoint, payload, options = {}) {
            const onUploadProgress = options.onUploadProgress;
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', endpoint, true);
                xhr.setRequestHeader('Authorization', `Bearer ${realApiKey}`);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.responseType = 'text';

                if (typeof onUploadProgress === 'function' && xhr.upload) {
                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) {
                            onUploadProgress(event.loaded, event.total);
                        }
                    };
                }

                xhr.onerror = () => {
                    resolve({ success: false, status: 0, error: 'Network error' });
                };

                xhr.onload = () => {
                    let data = {};
                    try {
                        data = xhr.responseText ? JSON.parse(xhr.responseText) : {};
                    } catch {
                        data = {};
                    }
                    resolve({
                        success: xhr.status >= 200 && xhr.status < 300,
                        status: xhr.status,
                        data,
                        error: xhr.status >= 200 && xhr.status < 300 ? null : `HTTP ${xhr.status}`
                    });
                };

                try {
                    xhr.send(JSON.stringify(payload));
                } catch (err) {
                    resolve({ success: false, status: 0, error: err.message || 'Send failed' });
                }
            });
        }

        function readFileAsBase64(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onprogress = (event) => {
                    if (typeof onProgress === 'function' && event.lengthComputable) {
                        onProgress(event.loaded, event.total);
                    }
                };
                reader.onload = () => {
                    const result = String(reader.result || '');
                    const base64 = result.includes(',') ? result.split(',')[1] : result;
                    resolve(base64);
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsDataURL(file);
            });
        }

        async function analyzeStandaloneLrc() {
            if (!realApiKey) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errNoApiKey'), 'error');
                return;
            }

            const audioUrl = lrcAudioUrlInput.value.trim();
            const file = lrcAudioFileInput.files?.[0] || null;
            if (!audioUrl && !file) {
                showStatus(t('errNeedAudioInput'), 'error');
                return;
            }

            setBusy(true);
            showLoadingStatus(t('loadingLrc'));
            lrcOutput.value = '';
            resetLrcProgress();

            try {
                let pre;
                if (file) {
                    latestLrcBaseName = sanitizeFilenameBase(file.name);
                    setLrcProgress(1, t('lrcProgressReading'));
                    const base64 = await readFileAsBase64(file, (loaded, total) => {
                        const pct = Math.max(1, Math.min(30, Math.floor((loaded / total) * 30)));
                        setLrcProgress(pct, t('lrcProgressReading'));
                    });

                    setLrcProgress(35, t('lrcProgressUploading'));
                    pre = await fetchStructuredLyrics({ audio_base64: base64 }, {
                        onUploadProgress: (loaded, total) => {
                            const ratio = total > 0 ? (loaded / total) : 0;
                            if (ratio >= 1) {
                                setLrcProgress(92, t('lrcProgressProcessing'), true);
                                return;
                            }
                            const pct = 35 + Math.floor(ratio * 55);
                            setLrcProgress(Math.max(35, Math.min(90, pct)), t('lrcProgressUploading'));
                        }
                    });
                    setLrcProgress(92, t('lrcProgressProcessing'), true);
                } else {
                    latestLrcBaseName = inferBaseNameFromUrl(audioUrl);
                    setLrcProgress(92, t('lrcProgressProcessing'), true);
                    pre = await fetchStructuredLyrics(audioUrl);
                }

                if (!pre.success) {
                    if (pre.status === 401) {
                        setFieldError(apiKeyInput, true);
                        showStatus(t('errInvalidKey'), 'error');
                    } else {
                        const err = pre.status === 0
                            ? t('errRequestInterrupted')
                            : getApiErrorInfo(pre.data, pre.error).detail;
                        showStatus(t('error') + err, 'error');
                    }
                    return;
                }

                const apiError = getApiErrorInfo(pre.data);
                if (apiError.statusCode && apiError.statusCode !== 0) {
                    showStatus(t('failed') + apiError.detail, 'error');
                    return;
                }

                latestLrcStructure = pre.data || {};
                latestLrcText = buildLrcFromPreprocess(pre.data, audioUrl || file?.name || 'Uploaded Audio');
                if (!latestLrcText.trim()) {
                    showStatus(t('historyLrcUnavailable'), 'info');
                    return;
                }

                lrcOutput.value = latestLrcText;
                downloadLrcBtn.disabled = false;
                downloadJsonBtn.disabled = false;
                setLrcProgress(100, t('successLrcReady'));
                showStatus(t('successLrcReady'), 'success');
            } catch (err) {
                showStatus(t('error') + (err?.message || String(err)), 'error');
            } finally {
                setBusy(false);
            }
        }

        function downloadTextFile(text, filename, mime = 'text/plain;charset=utf-8') {
            const blob = new Blob([text], { type: mime });
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        }

        function downloadLrcFile(text, filename) {
            // Use a generic binary mime type so browsers keep the explicit .lrc extension.
            downloadTextFile(text, filename, 'application/octet-stream');
        }

        async function downloadLrcEntry(index, btn) {
            const entries = loadHistory();
            let entry = entries[index];
            if (!entry) return;

            const orig = btn.textContent;
            btn.disabled = true;
            btn.textContent = '...';
            try {
                const hasPreprocessData = !!(entry.structureResult || entry.formattedLyrics);
                if (!hasPreprocessData && entry.url) {
                    showStatus(t('historyPreparingLrc'), 'info');
                    const pre = await fetchStructuredLyrics(entry.url);
                    if (pre.success) {
                        updateHistoryEntryById(entry.id, {
                            formattedLyrics: pre.data?.formatted_lyrics || '',
                            structureResult: pre.data?.structure_result || '',
                            audioDuration: Number(pre.data?.audio_duration || 0)
                        });
                        const refreshedEntries = loadHistory();
                        entry = refreshedEntries.find(e => e.id === entry.id) || entry;
                    } else {
                        const preErr = getApiErrorInfo(pre.data, pre.error).detail;
                        showStatus(t('historyLrcPrepareFailed') + preErr, 'error');
                    }
                }

                const lrc = buildSimpleLrc(entry);
                if (!lrc.trim()) {
                    showStatus(t('historyLrcUnavailable'), 'info');
                    return;
                }
                const baseName = `song_${new Date(entry.timestamp).toISOString().slice(0,19).replace(/[-:T]/g,'')}`;
                downloadLrcFile(lrc, `${baseName}.lrc`);
            } finally {
                btn.disabled = false;
                btn.textContent = orig;
            }
        }

        async function downloadEntry(url, filename, btn) {
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:12px;height:12px;border-width:2px"></div>';
            try {
                const resp = await fetch(url);
                let blob = await resp.blob();
                
                if (filename.endsWith('.mp3')) {
                    const entries = loadHistory();
                    const entry = entries.find(e => e.url === url);
                    if (entry && entry.lyrics) {
                        const arrayBuffer = await blob.arrayBuffer();
                        const taggedBuffer = prependID3Tag(arrayBuffer, filename.replace('.mp3', ''), entry.lyrics);
                        blob = new Blob([taggedBuffer], { type: 'audio/mpeg' });
                    }
                }
                
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            } catch {
                window.open(url, '_blank');
            } finally {
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        }

        function formatTimestamp(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderHistory() {
            const entries = loadHistory();
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');
            section.style.display = entries.length ? 'block' : 'none';
            if (!entries.length) { list.innerHTML = ''; return; }

            const now = Date.now();
            list.innerHTML = entries.map((e, i) => {
                const expired = (now - new Date(e.timestamp).getTime()) > 24 * 3600 * 1000;
                const canBuildLrc = !!(e.structureResult || e.formattedLyrics || e.lyrics);
                const canFetchLrc = !expired;
                const canDownloadLrc = canBuildLrc || canFetchLrc;
                return `
                <div class="history-item${expired ? ' expired' : ''}" data-history-index="${i}">
                    <div class="history-item-meta">
                        <span class="history-item-prompt" title="${e.prompt.replace(/"/g,'&quot;')}">${e.prompt}</span>
                        ${expired ? `<span class="history-expired-badge">${t('historyExpired')}</span>` : ''}
                        <span class="history-item-time">${formatTimestamp(e.timestamp)}</span>
                    </div>
                    <audio controls src="${e.url}"></audio>
                    <div class="history-item-actions">
                        <button class="history-action-btn btn-download" onclick="downloadEntry('${e.url}','song_${new Date(e.timestamp).toISOString().slice(0,19).replace(/[-:T]/g,'')}.${e.format||'mp3'}',this)">${t('historyDownload')}</button>
                        <button class="history-action-btn btn-download" ${canDownloadLrc ? '' : 'disabled'} onclick="downloadLrcEntry(${i},this)">${t('historyDownloadLrc')}</button>
                        <button class="history-action-btn btn-share" onclick="copyUrl('${e.url}',this)">${t('historyShare')}</button>
                    </div>
                </div>`;
            }).join('');

            list.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', (event) => {
                    const index = Number(item.dataset.historyIndex);
                    loadHistoryEntry(index, event);
                });
            });

            // re-apply i18n for static labels in history header
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (el.closest('#historySection')) el.textContent = t(el.dataset.i18n);
            });
        }
        // ─────────────────────────────────────────────────────────

        let realApiKey = localStorage.getItem('musicgen_apikey') || '';

        function maskApiKey(key) {
            if (!key || key.length < 12) return key;
            return key.slice(0, 6) + '...' + key.slice(-6);
        }

        apiKeyInput.value = maskApiKey(realApiKey);
        apiKeyInput.addEventListener('focus', () => {
            apiKeyInput.value = realApiKey;
        });
        apiKeyInput.addEventListener('blur', () => {
            realApiKey = apiKeyInput.value.trim();
            localStorage.setItem('musicgen_apikey', realApiKey);
            apiKeyInput.value = maskApiKey(realApiKey);
        });
        apiKeyInput.addEventListener('input', () => {
            setFieldError(apiKeyInput, false);
        });

        promptInput.value = localStorage.getItem('musicgen_prompt') || '';
        promptInput.addEventListener('input', () => {
            localStorage.setItem('musicgen_prompt', promptInput.value);
        });

        lyricsInput.value = localStorage.getItem('musicgen_lyrics') || '';
        lyricsInput.addEventListener('input', () => {
            localStorage.setItem('musicgen_lyrics', lyricsInput.value);
        });

        lrcAudioUrlInput.addEventListener('input', () => {
            latestLrcText = '';
            latestLrcStructure = null;
            latestLrcBaseName = '';
            lrcOutput.value = '';
            downloadLrcBtn.disabled = true;
            downloadJsonBtn.disabled = true;
            resetLrcProgress();
        });

        lrcAudioFileInput.addEventListener('change', () => {
            latestLrcText = '';
            latestLrcStructure = null;
            latestLrcBaseName = '';
            lrcOutput.value = '';
            downloadLrcBtn.disabled = true;
            downloadJsonBtn.disabled = true;
            resetLrcProgress();
        });

        const savedMode = localStorage.getItem('musicgen_mode');
        if (savedMode) setMode(savedMode);

        setToolTab(currentToolTab);

        generateBtn.addEventListener('click', async () => {
            if (!realApiKey) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errNoApiKey'), 'error');
                return;
            }
            if (!promptInput.value.trim()) { showStatus(t('errNoPrompt'), 'error'); return; }
            if (mode === 'review' && !lyricsInput.value.trim()) { showStatus(t('errNoLyrics'), 'error'); return; }

            localStorage.setItem('musicgen_prompt', promptInput.value);
            generationInFlight = true;
            localStorage.setItem(INFLIGHT_KEY, '1');
            setBusy(true);
            showLoadingStatus(t('loadingMusic'));

            const payload = {
                model: 'music-2.6',
                prompt: promptInput.value.trim(),
                audio_setting: {
                    sample_rate: parseInt(sampleRateSelect.value),
                    bitrate: parseInt(bitrateSelect.value) * 1000,
                    format: formatSelect.value
                },
                output_format: 'url'
            };

            if (mode === 'auto') {
                payload.lyrics_optimizer = true;
            } else if (mode === 'instrumental') {
                payload.is_instrumental = true;
            } else {
                payload.lyrics = lyricsInput.value.trim();
            }

            let result = await callMusicGenerationWithRetry(payload);
            
            if (!result.success) {
                generationInFlight = false;
                localStorage.removeItem(INFLIGHT_KEY);
                setBusy(false);
                if (result.status === 401) {
                    setFieldError(apiKeyInput, true);
                    showStatus(t('errInvalidKey'), 'error');
                } else {
                    const finalErr = result.status === 0
                        ? t('errRequestInterrupted')
                        : getApiErrorInfo(result.data, result.error).detail;
                    showStatus(t('error') + finalErr, 'error');
                }
                console.warn('[music_generation] request failed', {
                    status: result.status,
                    error: result.error,
                    data: result.data,
                    hidden: document.hidden
                });
                return;
            }

            let data = result.data;
            generationInFlight = false;
            localStorage.removeItem(INFLIGHT_KEY);
            setBusy(false);

            const apiError = getApiErrorInfo(data);
            if (apiError.statusCode && apiError.statusCode !== 0) {
                showStatus(t('failed') + apiError.detail, 'error');
                console.warn('[music_generation] api returned error', {
                    statusCode: apiError.statusCode,
                    traceId: apiError.traceId,
                    data
                });
                return;
            }

            if (data?.data?.status === 2 && data?.data?.audio) {
                const audioUrl = data.data.audio;
                const fmt = formatSelect.value;
                let lyricsForHistory = '';
                if (mode === 'review') {
                    lyricsForHistory = lyricsInput.value.trim();
                }
                if (!lyricsForHistory && data.data?.lyrics) {
                    lyricsForHistory = data.data.lyrics;
                }
                const entryId = addToHistory(audioUrl, promptInput.value.trim(), fmt, lyricsForHistory);

                // Best-effort enrichment: parse generated audio for structured lyrics/timeline.
                fetchStructuredLyrics(audioUrl).then(pre => {
                    if (pre.success) {
                        updateHistoryEntryById(entryId, {
                            formattedLyrics: pre.data?.formatted_lyrics || '',
                            structureResult: pre.data?.structure_result || ''
                        });
                    } else {
                        console.warn('[music_cover_preprocess] failed', pre);
                    }
                }).catch(err => {
                    console.warn('[music_cover_preprocess] failed', err);
                });

                showStatus(t('successMusic'), 'success');
            } else if (data?.data?.status === 1) {
                showStatus(t('inProgress'), 'info');
            } else {
                showStatus(t('failed') + getApiErrorInfo(data).detail, 'error');
            }
        });

        lyricsBtn.addEventListener('click', async () => {
            if (!realApiKey) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errNoApiKey'), 'error');
                return;
            }
            if (!promptInput.value.trim()) { showStatus(t('errNoPrompt'), 'error'); return; }
            if (!confirm(t('confirmLyrics'))) return;
            localStorage.setItem('musicgen_prompt', promptInput.value);

            const origLyricsLabel = lyricsBtn.innerHTML;
            lyricsBtn.innerHTML = '<div class="spinner" style="width:11px;height:11px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;display:inline-block;vertical-align:middle"></div>';
            setBusy(true);
            showLoadingStatus(t('loadingLyrics'));

            const result = await callApi('https://api.minimaxi.com/v1/lyrics_generation', {
                mode: 'write_full_song',
                prompt: promptInput.value.trim()
            });
            setBusy(false);
            lyricsBtn.innerHTML = origLyricsLabel;

            if (result.success && result.data.lyrics) {
                lyricsInput.value = result.data.lyrics;
                localStorage.setItem('musicgen_lyrics', result.data.lyrics);
                showStatus(t('successLyrics'), 'success');
            } else if (result.success && result.data.task_id) {
                showStatus(t('taskSubmitted') + result.data.task_id, 'info');
            } else if (result.status === 401) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errInvalidKey'), 'error');
            } else {
                const errMsg = result.data?.base_resp?.err_msg || result.error;
                showStatus((result.success ? t('failed') : t('error')) + errMsg, 'error');
            }
        });

        analyzeLrcBtn.addEventListener('click', analyzeStandaloneLrc);

        downloadLrcBtn.addEventListener('click', () => {
            if (!latestLrcText.trim()) return;
            const baseName = latestLrcBaseName || `lrc_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')}`;
            downloadLrcFile(latestLrcText, `${baseName}.lrc`);
        });

        downloadJsonBtn.addEventListener('click', () => {
            if (!latestLrcStructure) return;
            const baseName = latestLrcBaseName || `timeline_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')}`;
            downloadTextFile(JSON.stringify(latestLrcStructure, null, 2), `${baseName}.timeline.json`, 'application/json;charset=utf-8');
        });

        applyLocale();
        renderHistory();
    </script>
</body>
</html>
