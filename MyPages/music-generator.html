<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf4ff 100%);
            color: #1e1e3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 8px 40px rgba(108, 80, 200, 0.12);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560 0%, #7c4dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lang-toggle {
            display: flex;
            border: 1.5px solid #d0c8f0;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lang-btn {
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #9090b0;
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #e94560, #7c4dff);
            color: #fff;
        }

        .lang-btn:not(.active):hover {
            background: #f0eeff;
            color: #5c40cc;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #7070a0;
            margin-bottom: 7px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 11px 14px;
            background-color: #f7f8fd;
            color: #1e1e3a;
            border: 1.5px solid #dcdcf0;
            border-radius: 6px;
            font-size: 14px;
            font-family: "Segoe UI", sans-serif;
            transition: border-color 0.25s, background 0.25s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #e94560;
            background-color: #fff;
        }

        input::placeholder,
        textarea::placeholder {
            color: #b0b0c8;
        }

        textarea {
            resize: vertical;
            min-height: 140px;
            font-family: "Segoe UI", sans-serif;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            border: 1.5px solid #d0c8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-right: 1px solid #d0c8f0;
            background: transparent;
            color: #9090b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            line-height: 1.3;
        }

        .mode-btn:last-child {
            border-right: none;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #e94560, #7c4dff);
            color: #fff;
        }

        .mode-btn:not(.active):hover {
            background: #f0eeff;
            color: #5c40cc;
        }

        /* Lyrics section */
        .lyrics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .lyrics-header label {
            margin: 0;
        }

        .lyrics-gen-btn {
            padding: 5px 14px;
            background: linear-gradient(135deg, #16c79a 0%, #0ea57e 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(22, 199, 154, 0.25);
            transition: opacity 0.2s, transform 0.15s;
        }

        .lyrics-gen-btn:hover:not(:disabled) {
            opacity: 0.88;
        }

        .lyrics-gen-btn:not(:disabled):active {
            transform: scale(0.97);
        }

        .lyrics-gen-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Audio settings */
        .audio-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
            color: #7070a0;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .audio-toggle:hover {
            color: #5c40cc;
        }

        .toggle-arrow {
            font-size: 10px;
            transition: transform 0.2s;
            display: inline-block;
        }

        .toggle-arrow.open {
            transform: rotate(90deg);
        }

        .audio-settings {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .audio-settings select {
            padding: 9px 10px;
            font-size: 13px;
        }

        /* Field error state */
        .field-error {
            border-color: #e94560 !important;
            background-color: rgba(233, 69, 96, 0.05) !important;
        }

        /* Generate button */
        .generate-btn {
            width: 100%;
            margin-top: 24px;
            padding: 14px 20px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #e94560 0%, #c0304a 100%);
            color: white;
            box-shadow: 0 3px 14px rgba(233, 69, 96, 0.28);
            transition: opacity 0.25s, transform 0.15s, box-shadow 0.25s;
        }

        .generate-btn:hover:not(:disabled) {
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.40);
            opacity: 0.92;
        }

        .generate-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        .generate-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Status */
        .status {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 13px;
            min-height: 20px;
            display: flex;
            align-items: center;
        }

        .status.success {
            background-color: rgba(22, 199, 154, 0.12);
            color: #0c9e73;
            border: 1px solid rgba(22, 199, 154, 0.3);
        }

        .status.error {
            background-color: rgba(233, 69, 96, 0.1);
            color: #c82040;
            border: 1px solid rgba(233, 69, 96, 0.25);
        }

        .status.info {
            background-color: rgba(124, 77, 255, 0.09);
            color: #6030cc;
            border: 1px solid rgba(124, 77, 255, 0.2);
        }

        .status.loading {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(124, 77, 255, 0.09);
            color: #6030cc;
            border: 1px solid rgba(124, 77, 255, 0.2);
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(124, 77, 255, 0.25);
            border-top-color: #7c4dff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* History */
        .history-section {
            margin-top: 28px;
            border-top: 1.5px solid #ececf8;
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .history-title {
            font-size: 13px;
            font-weight: 600;
            color: #7070a0;
            letter-spacing: 0.02em;
        }

        .history-clear-btn {
            background: none;
            border: 1px solid #dcdcf0;
            border-radius: 5px;
            padding: 3px 10px;
            font-size: 12px;
            color: #9090b0;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .history-clear-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .history-empty {
            font-size: 13px;
            color: #b0b0c8;
            text-align: center;
            padding: 16px 0;
        }

        .history-item {
            background: #f7f8fd;
            border: 1.5px solid #ececf8;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }


        .history-item-meta {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
        }

        .history-item-prompt {
            font-size: 13px;
            color: #1e1e3a;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-time {
            font-size: 11px;
            color: #b0b0c8;
            flex-shrink: 0;
        }

        .history-expired-badge {
            font-size: 11px;
            font-weight: 600;
            color: #c08000;
            background: rgba(255, 180, 0, 0.12);
            border: 1px solid rgba(255, 180, 0, 0.35);
            border-radius: 4px;
            padding: 1px 6px;
            flex-shrink: 0;
        }

        .history-item.expired {
            opacity: 0.65;
        }

        .history-item.expired audio {
            pointer-events: none;
            filter: grayscale(1);
        }

        .history-item audio {
            width: 100%;
            height: 32px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .history-item-actions {
            display: flex;
            gap: 8px;
        }

        .history-action-btn {
            flex: 1;
            padding: 5px 0;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid;
            transition: opacity 0.2s;
            text-align: center;
        }

        .history-action-btn:hover { opacity: 0.75; }

        .btn-download {
            border-color: #7c4dff;
            color: #7c4dff;
            background: rgba(124, 77, 255, 0.06);
        }

        .btn-share {
            border-color: #16c79a;
            color: #0c9e73;
            background: rgba(22, 199, 154, 0.07);
        }

        .btn-share.copied {
            border-color: #16c79a;
            color: #fff;
            background: #16c79a;
        }


        @media (max-width: 600px) {
            .container {
                padding: 22px 18px;
            }

            .audio-settings {
                grid-template-columns: 1fr;
            }

            .mode-btn {
                font-size: 12px;
                padding: 9px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 data-i18n="title">Music Generator</h1>
            <div class="lang-toggle">
                <button class="lang-btn" id="btnEn" onclick="setLocale('en')">EN</button>
                <button class="lang-btn" id="btnZh" onclick="setLocale('zh')">中文</button>
            </div>
        </div>

        <div class="form-group">
            <label for="apiKey" data-i18n="apiKeyLabel">API Key:</label>
            <input type="text" id="apiKey" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Enter your Minimax API key">
        </div>

        <div class="form-group">
            <div class="lyrics-header">
                <label for="prompt" data-i18n="promptLabel">Prompt:</label>
                <button class="lyrics-gen-btn" style="background:linear-gradient(135deg,#7c4dff 0%,#5c30cc 100%);box-shadow:0 2px 8px rgba(124,77,255,0.25)" onclick="copyPrompt(this)" data-i18n="copyPromptBtn">Copy Prompt</button>
            </div>
            <textarea id="prompt" data-i18n-placeholder="promptPlaceholder" placeholder="Describe the music style you want to generate" style="min-height:80px"></textarea>
        </div>

        <div class="form-group">
            <label data-i18n="modeLabel">Mode:</label>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="auto" onclick="setMode('auto')" data-i18n="modeAuto">Auto Lyrics</button>
                <button class="mode-btn" data-mode="review" onclick="setMode('review')" data-i18n="modeReview">Edit Lyrics</button>
                <button class="mode-btn" data-mode="instrumental" onclick="setMode('instrumental')" data-i18n="modeInstrumental">Instrumental</button>
            </div>
        </div>

        <div class="form-group" id="lyricsSection" style="display:none">
            <div class="lyrics-header">
                <label for="lyrics" data-i18n="lyricsLabel">Lyrics:</label>
                <div style="display:flex;gap:8px">
                    <button class="lyrics-gen-btn" id="lyricsBtn" data-i18n="lyricsBtn">Generate Lyrics</button>
                    <button class="lyrics-gen-btn" style="background:linear-gradient(135deg,#7c4dff 0%,#5c30cc 100%);box-shadow:0 2px 8px rgba(124,77,255,0.25)" onclick="copyLyrics(this)" data-i18n="copyLyricsBtn">Copy Lyrics</button>
                </div>
            </div>
            <textarea id="lyrics" data-i18n-placeholder="lyricsPlaceholder" placeholder="Click 'Generate Lyrics' or type directly"></textarea>
        </div>

        <div class="form-group">
            <button class="audio-toggle" id="audioToggle" onclick="toggleAudio()">
                <span class="toggle-arrow" id="audioArrow">▶</span>
                <span data-i18n="audioSettings">Audio Settings</span>
            </button>
            <div class="audio-settings" id="audioPanel" style="display:none">
                <select id="sampleRate">
                    <option value="16000">16000 Hz</option>
                    <option value="24000">24000 Hz</option>
                    <option value="32000">32000 Hz</option>
                    <option value="44100" selected>44100 Hz</option>
                </select>
                <select id="bitrate">
                    <option value="32">32 kbps</option>
                    <option value="64">64 kbps</option>
                    <option value="128">128 kbps</option>
                    <option value="256" selected>256 kbps</option>
                </select>
                <select id="format">
                    <option value="mp3" selected>MP3</option>
                    <option value="wav">WAV</option>
                    <option value="pcm">PCM</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn" data-i18n="generateBtn">Generate Music</button>

        <div class="status" id="status"></div>

        <div class="history-section" id="historySection" style="display:none">
            <div class="history-header">
                <span class="history-title" data-i18n="historyLabel">Generation History</span>
                <div style="display:flex;gap:6px">
                    <button class="history-clear-btn" id="btnClearExpired" onclick="clearExpired()" data-i18n="historyClearExpired">Clear Expired</button>
                    <button class="history-clear-btn" onclick="clearHistory()" data-i18n="historyClear">Clear History</button>
                </div>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: 'Music Generator',
                apiKeyLabel: 'API Key:',
                apiKeyPlaceholder: 'Enter your Minimax API key',
                promptLabel: 'Prompt:',
                promptPlaceholder: 'Describe the music style you want to generate',
                modeLabel: 'Mode:',
                modeAuto: 'Auto Lyrics',
                modeReview: 'Edit Lyrics',
                modeInstrumental: 'Instrumental',
                lyricsLabel: 'Lyrics:',
                lyricsPlaceholder: "Click 'Generate Lyrics' or type directly",
                audioSettings: 'Audio Settings',
                generateBtn: 'Generate Music',
                lyricsBtn: 'Generate Lyrics',
                copyPromptBtn: 'Copy Prompt',
                copyLyricsBtn: 'Copy Lyrics',
                errNoApiKey: 'Please enter API key',
                errInvalidKey: 'API key invalid or unauthorized',
                errNoPrompt: 'Please enter style prompt',
                errNoLyrics: 'Please generate or enter lyrics first',
                loadingMusic: 'Generating music...',
                loadingLyrics: 'Generating lyrics...',
                successMusic: 'Music generated successfully!',
                confirmLyrics: 'This will make an API call to generate lyrics. Continue?',
                successLyrics: 'Lyrics generated — review and edit before generating music.',
                inProgress: 'Music generation in progress...',
                taskSubmitted: 'Task submitted: ',
                failed: 'Failed: ',
                error: 'Error: ',
                historyLabel: 'Generation History',
                historyClear: 'Clear All',
                historyEmpty: 'No history yet',
                historyDownload: 'Download',
                historyShare: 'Copy Link',
                historyCopied: 'Copied!',
                historyExpired: 'Expired',
                historyClearExpired: 'Clear Expired',
                historyLoadedPrompt: 'Loaded prompt from history.',
                historyLoadedPromptLyrics: 'Loaded prompt and lyrics from history.'
            },
            zh: {
                title: '音乐生成器',
                apiKeyLabel: 'API 密钥:',
                apiKeyPlaceholder: '请输入您的 Minimax API 密钥',
                promptLabel: '风格描述:',
                promptPlaceholder: '描述您想生成的音乐风格',
                copyLyricsBtn: '复制歌词',
                modeLabel: '生成模式:',
                modeAuto: '自动生成歌词',
                modeReview: '预览并编辑歌词',
                modeInstrumental: '纯音乐',
                lyricsLabel: '歌词:',
                lyricsPlaceholder: '点击「生成歌词」，或直接输入',
                audioSettings: '音频设置',
                generateBtn: '生成音乐',
                lyricsBtn: '生成歌词',
                copyPromptBtn: '复制提示词',
                errNoApiKey: '请输入 API 密钥',
                errInvalidKey: 'API 密钥无效或未授权',
                errNoPrompt: '请输入风格描述',
                errNoLyrics: '请先生成或输入歌词',
                loadingMusic: '正在生成音乐...',
                loadingLyrics: '正在生成歌词...',
                successMusic: '音乐生成成功！',
                confirmLyrics: '将调用 API 生成歌词，确认继续？',
                successLyrics: '歌词已生成，请确认或编辑后再生成音乐。',
                inProgress: '音乐生成中，请稍候...',
                taskSubmitted: '任务已提交: ',
                failed: '失败: ',
                error: '错误: ',
                historyLabel: '生成历史',
                historyClear: '清空',
                historyEmpty: '暂无历史记录',
                historyDownload: '下载',
                historyShare: '复制链接',
                historyCopied: '已复制！',
                historyExpired: '已过期',
                historyClearExpired: '清除过期',
                historyLoadedPrompt: '已从历史记录载入提示词。',
                historyLoadedPromptLyrics: '已从历史记录载入提示词和歌词。'
            }
        };

        let locale = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
        let mode = 'auto';

        function t(key) {
            return translations[locale][key] || translations.en[key] || key;
        }

        function applyLocale() {
            document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
            document.getElementById('btnEn').classList.toggle('active', locale === 'en');
            document.getElementById('btnZh').classList.toggle('active', locale === 'zh');
        }

        function setLocale(lang) {
            locale = lang;
            applyLocale();
            renderHistory();
        }

        function setMode(m) {
            mode = m;
            localStorage.setItem('musicgen_mode', m);
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === m);
            });
            document.getElementById('lyricsSection').style.display = m === 'review' ? 'block' : 'none';
            statusDiv.className = 'status';
            statusDiv.textContent = '';
        }

        function toggleAudio() {
            const panel = document.getElementById('audioPanel');
            const arrow = document.getElementById('audioArrow');
            const open = panel.style.display !== 'none';
            panel.style.display = open ? 'none' : 'grid';
            arrow.classList.toggle('open', !open);
        }

        function setFieldError(input, hasError) {
            input.classList.toggle('field-error', hasError);
        }

        const apiKeyInput   = document.getElementById('apiKey');
        const promptInput   = document.getElementById('prompt');
        const lyricsInput   = document.getElementById('lyrics');
        const sampleRateSelect = document.getElementById('sampleRate');
        const bitrateSelect = document.getElementById('bitrate');
        const formatSelect  = document.getElementById('format');
        const generateBtn   = document.getElementById('generateBtn');
        const lyricsBtn     = document.getElementById('lyricsBtn');
        const statusDiv     = document.getElementById('status');
        const INFLIGHT_KEY  = 'musicgen_inflight';

        let generationInFlight = localStorage.getItem(INFLIGHT_KEY) === '1';

        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function showLoadingStatus(message) {
            statusDiv.innerHTML = `<div class="spinner"></div>${message}`;
            statusDiv.className = 'status loading';
        }

        function setBusy(busy) {
            generateBtn.disabled = busy;
            lyricsBtn.disabled = busy;
        }

        if (generationInFlight) {
            showStatus(t('inProgress'), 'info');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && generationInFlight) {
                showStatus(t('inProgress'), 'info');
            }
        });

        async function callApi(endpoint, payload, method = 'POST') {
            try {
                const fetchOptions = {
                    method,
                    keepalive: true,
                    headers: {
                        'Authorization': `Bearer ${realApiKey}`,
                        'Content-Type': 'application/json'
                    }
                };
                if (method !== 'GET' && payload !== undefined) {
                    fetchOptions.body = JSON.stringify(payload);
                }

                const response = await fetch(endpoint, fetchOptions);
                let data = {};
                try {
                    data = await response.json();
                } catch {
                    data = {};
                }
                return { success: response.ok, status: response.status, data, error: response.ok ? null : `HTTP ${response.status}` };
            } catch (err) {
                return { success: false, status: 0, error: err.message };
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ── History ──────────────────────────────────────────────
        const HISTORY_KEY = 'musicgen_history';
        const HISTORY_MAX = 50;

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
            catch { return []; }
        }

        function saveHistory(entries) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(entries));
        }

        function addToHistory(url, prompt, format, lyrics = '') {
            const entries = loadHistory();
            entries.unshift({ url, prompt, format, lyrics, timestamp: new Date().toISOString() });
            if (entries.length > HISTORY_MAX) entries.length = HISTORY_MAX;
            saveHistory(entries);
            renderHistory();
        }

        function loadHistoryEntry(index, event) {
            if (event?.target?.closest('.history-action-btn, audio')) return;

            const entries = loadHistory();
            const entry = entries[index];
            if (!entry) return;

            promptInput.value = entry.prompt || '';
            localStorage.setItem('musicgen_prompt', promptInput.value);

            lyricsInput.value = entry.lyrics || '';
            localStorage.setItem('musicgen_lyrics', lyricsInput.value);

            if (entry.lyrics) {
                setMode('review');
                setTimeout(() => {
                    document.getElementById('lyricsSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }

            showStatus(entry.lyrics ? t('historyLoadedPromptLyrics') : t('historyLoadedPrompt'), 'info');
        }

        function clearHistory() {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        }

        function clearExpired() {
            const now = Date.now();
            const entries = loadHistory().filter(e => (now - new Date(e.timestamp).getTime()) <= 24 * 3600 * 1000);
            saveHistory(entries);
            renderHistory();
        }

        async function copyPrompt(btn) {
            const text = promptInput.value.trim();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            const orig = btn.textContent;
            btn.textContent = t('historyCopied');
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }

        async function copyLyrics(btn) {
            const text = lyricsInput.value.trim();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            const orig = btn.textContent;
            btn.textContent = t('historyCopied');
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }

        async function copyUrl(url, btn) {
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            const orig = btn.textContent;
            btn.textContent = t('historyCopied');
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
        }

        function createID3v2Tag(title, lyrics) {
            if (!lyrics) return null;
            
            const enc = new TextEncoder();
            const frames = [];
            
            const createTextFrame = (frameId, text) => {
                const textBytes = enc.encode(text);
                const frame = new Uint8Array(11 + textBytes.length);
                frame.set(enc.encode(frameId), 0);
                const size = 1 + textBytes.length;
                frame[4] = (size >> 8) & 0xFF;
                frame[5] = size & 0xFF;
                frame[6] = 0;
                frame[7] = 0;
                frame[8] = 0;
                frame[9] = 0;
                frame.set(textBytes, 10);
                return frame;
            };
            
            const createUSLTFrame = (lyrics) => {
                const lyricsBytes = enc.encode(lyrics);
                const contentSize = 4 + lyricsBytes.length + 1;
                const frame = new Uint8Array(10 + contentSize);
                frame.set(enc.encode('USLT'), 0);
                frame[4] = (contentSize >> 8) & 0xFF;
                frame[5] = contentSize & 0xFF;
                frame[6] = 0;
                frame[7] = 0;
                frame[8] = 0;
                frame[9] = 3;
                frame.set(enc.encode('eng\0'), 10);
                frame.set(lyricsBytes, 14);
                return frame;
            };
            
            frames.push(createTextFrame('TIT2', title || 'Generated Music'));
            frames.push(createTextFrame('TPE1', 'Music Generator'));
            frames.push(createUSLTFrame(lyrics));
            
            const frameData = frames.reduce((acc, frame) => acc.concat(Array.from(frame)), []);
            const frameBytes = new Uint8Array(frameData);
            
            const tagSize = frameBytes.length;
            const synchsafeSize = new Uint8Array([
                (tagSize >> 21) & 0x7F,
                (tagSize >> 14) & 0x7F,
                (tagSize >> 7) & 0x7F,
                tagSize & 0x7F
            ]);
            
            const id3Header = new Uint8Array(10);
            id3Header.set(enc.encode('ID3'), 0);
            id3Header[3] = 4;
            id3Header[4] = 0;
            id3Header[5] = 0;
            id3Header.set(synchsafeSize, 6);
            
            const tag = new Uint8Array(id3Header.length + frameBytes.length);
            tag.set(id3Header, 0);
            tag.set(frameBytes, id3Header.length);
            
            return tag;
        }

        function prependID3Tag(audioBuffer, title, lyrics) {
            const id3Tag = createID3v2Tag(title, lyrics);
            if (!id3Tag) return new Uint8Array(audioBuffer);
            
            const audioData = new Uint8Array(audioBuffer);
            let audioStart = 0;
            
            if (audioData.length > 3 && String.fromCharCode(audioData[0], audioData[1], audioData[2]) === 'ID3') {
                const size = ((audioData[6] & 0x7f) << 21) | ((audioData[7] & 0x7f) << 14) | ((audioData[8] & 0x7f) << 7) | (audioData[9] & 0x7f);
                audioStart = 10 + size;
            }
            
            const result = new Uint8Array(id3Tag.length + audioData.length - audioStart);
            result.set(id3Tag, 0);
            result.set(audioData.subarray(audioStart), id3Tag.length);
            
            return result;
        }

        async function downloadEntry(url, filename, btn) {
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:12px;height:12px;border-width:2px"></div>';
            try {
                const resp = await fetch(url);
                let blob = await resp.blob();
                
                if (filename.endsWith('.mp3')) {
                    const entries = loadHistory();
                    const entry = entries.find(e => e.url === url);
                    if (entry && entry.lyrics) {
                        const arrayBuffer = await blob.arrayBuffer();
                        const taggedBuffer = prependID3Tag(arrayBuffer, filename.replace('.mp3', ''), entry.lyrics);
                        blob = new Blob([taggedBuffer], { type: 'audio/mpeg' });
                    }
                }
                
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            } catch {
                window.open(url, '_blank');
            } finally {
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        }

        function formatTimestamp(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderHistory() {
            const entries = loadHistory();
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');
            section.style.display = entries.length ? 'block' : 'none';
            if (!entries.length) { list.innerHTML = ''; return; }

            const now = Date.now();
            list.innerHTML = entries.map((e, i) => {
                const expired = (now - new Date(e.timestamp).getTime()) > 24 * 3600 * 1000;
                return `
                <div class="history-item${expired ? ' expired' : ''}" data-history-index="${i}">
                    <div class="history-item-meta">
                        <span class="history-item-prompt" title="${e.prompt.replace(/"/g,'&quot;')}">${e.prompt}</span>
                        ${expired ? `<span class="history-expired-badge">${t('historyExpired')}</span>` : ''}
                        <span class="history-item-time">${formatTimestamp(e.timestamp)}</span>
                    </div>
                    <audio controls src="${e.url}"></audio>
                    <div class="history-item-actions">
                        <button class="history-action-btn btn-download" onclick="downloadEntry('${e.url}','song_${new Date(e.timestamp).toISOString().slice(0,19).replace(/[-:T]/g,'')}.${e.format||'mp3'}',this)">${t('historyDownload')}</button>
                        <button class="history-action-btn btn-share" onclick="copyUrl('${e.url}',this)">${t('historyShare')}</button>
                    </div>
                </div>`;
            }).join('');

            list.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', (event) => {
                    const index = Number(item.dataset.historyIndex);
                    loadHistoryEntry(index, event);
                });
            });

            // re-apply i18n for static labels in history header
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (el.closest('#historySection')) el.textContent = t(el.dataset.i18n);
            });
        }
        // ─────────────────────────────────────────────────────────

        let realApiKey = localStorage.getItem('musicgen_apikey') || '';

        function maskApiKey(key) {
            if (!key || key.length < 12) return key;
            return key.slice(0, 6) + '...' + key.slice(-6);
        }

        apiKeyInput.value = maskApiKey(realApiKey);
        apiKeyInput.addEventListener('focus', () => {
            apiKeyInput.value = realApiKey;
        });
        apiKeyInput.addEventListener('blur', () => {
            realApiKey = apiKeyInput.value.trim();
            localStorage.setItem('musicgen_apikey', realApiKey);
            apiKeyInput.value = maskApiKey(realApiKey);
        });
        apiKeyInput.addEventListener('input', () => {
            setFieldError(apiKeyInput, false);
        });

        promptInput.value = localStorage.getItem('musicgen_prompt') || '';
        promptInput.addEventListener('input', () => {
            localStorage.setItem('musicgen_prompt', promptInput.value);
        });

        lyricsInput.value = localStorage.getItem('musicgen_lyrics') || '';
        lyricsInput.addEventListener('input', () => {
            localStorage.setItem('musicgen_lyrics', lyricsInput.value);
        });

        const savedMode = localStorage.getItem('musicgen_mode');
        if (savedMode) setMode(savedMode);

        generateBtn.addEventListener('click', async () => {
            if (!realApiKey) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errNoApiKey'), 'error');
                return;
            }
            if (!promptInput.value.trim()) { showStatus(t('errNoPrompt'), 'error'); return; }
            if (mode === 'review' && !lyricsInput.value.trim()) { showStatus(t('errNoLyrics'), 'error'); return; }

            localStorage.setItem('musicgen_prompt', promptInput.value);
            generationInFlight = true;
            localStorage.setItem(INFLIGHT_KEY, '1');
            setBusy(true);
            showLoadingStatus(t('loadingMusic'));

            const payload = {
                model: 'music-2.6',
                prompt: promptInput.value.trim(),
                audio_setting: {
                    sample_rate: parseInt(sampleRateSelect.value),
                    bitrate: parseInt(bitrateSelect.value) * 1000,
                    format: formatSelect.value
                },
                output_format: 'url'
            };

            if (mode === 'auto') {
                payload.lyrics_optimizer = true;
            } else if (mode === 'instrumental') {
                payload.is_instrumental = true;
            } else {
                payload.lyrics = lyricsInput.value.trim();
            }

            let result = await callApi('https://api.minimaxi.com/v1/music_generation', payload);
            
            if (!result.success) {
                generationInFlight = false;
                localStorage.removeItem(INFLIGHT_KEY);
                setBusy(false);
                if (result.status === 401) {
                    setFieldError(apiKeyInput, true);
                    showStatus(t('errInvalidKey'), 'error');
                } else {
                    showStatus(t('error') + (result.data?.base_resp?.err_msg || result.error), 'error');
                }
                return;
            }

            let data = result.data;
            generationInFlight = false;
            localStorage.removeItem(INFLIGHT_KEY);
            setBusy(false);

            if (data?.data?.status === 2 && data?.data?.audio) {
                const audioUrl = data.data.audio;
                const fmt = formatSelect.value;
                let lyricsForHistory = '';
                if (mode === 'review') {
                    lyricsForHistory = lyricsInput.value.trim();
                }
                if (!lyricsForHistory && data.data?.lyrics) {
                    lyricsForHistory = data.data.lyrics;
                }
                addToHistory(audioUrl, promptInput.value.trim(), fmt, lyricsForHistory);
                showStatus(t('successMusic'), 'success');
            } else if (data?.data?.status === 1) {
                showStatus(t('inProgress'), 'info');
            } else {
                showStatus(t('failed') + (data?.base_resp?.err_msg || 'Unknown error'), 'error');
            }
        });

        lyricsBtn.addEventListener('click', async () => {
            if (!realApiKey) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errNoApiKey'), 'error');
                return;
            }
            if (!promptInput.value.trim()) { showStatus(t('errNoPrompt'), 'error'); return; }
            if (!confirm(t('confirmLyrics'))) return;
            localStorage.setItem('musicgen_prompt', promptInput.value);

            const origLyricsLabel = lyricsBtn.innerHTML;
            lyricsBtn.innerHTML = '<div class="spinner" style="width:11px;height:11px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;display:inline-block;vertical-align:middle"></div>';
            setBusy(true);
            showLoadingStatus(t('loadingLyrics'));

            const result = await callApi('https://api.minimaxi.com/v1/lyrics_generation', {
                mode: 'write_full_song',
                prompt: promptInput.value.trim()
            });
            setBusy(false);
            lyricsBtn.innerHTML = origLyricsLabel;

            if (result.success && result.data.lyrics) {
                lyricsInput.value = result.data.lyrics;
                localStorage.setItem('musicgen_lyrics', result.data.lyrics);
                showStatus(t('successLyrics'), 'success');
            } else if (result.success && result.data.task_id) {
                showStatus(t('taskSubmitted') + result.data.task_id, 'info');
            } else if (result.status === 401) {
                setFieldError(apiKeyInput, true);
                showStatus(t('errInvalidKey'), 'error');
            } else {
                const errMsg = result.data?.base_resp?.err_msg || result.error;
                showStatus((result.success ? t('failed') : t('error')) + errMsg, 'error');
            }
        });

        applyLocale();
        renderHistory();
    </script>
</body>
