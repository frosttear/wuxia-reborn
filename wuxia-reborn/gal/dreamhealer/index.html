<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦境诊疗师</title>
<link rel="stylesheet" href="style.css">
<script defer src="catalog.js?v=2"></script><script defer src="game.js?v=2"></script>
</head>
<body>
<main id="main-menu" data-cover="dream" aria-labelledby="game-name">
  <img id="cover" src="assets/title-dream.webp" alt="" fetchpriority="high">
  <div class="menu-content">
    <p class="menu-scene" id="menu-scene">血红之梦</p>
    <h1 id="game-name">梦境诊疗师</h1>
    <p class="menu-credit">改编自守拙原作</p>
    <p id="menu-status" role="status"></p>
    <nav class="menu-actions" aria-label="主菜单">
      <button id="resume" hidden>继续游戏</button>
      <button id="start">开始游戏</button>
      <button id="menu-load" hidden>读取存档</button>
      <button id="menu-catalog">图鉴</button>
    </nav>
  </div>
</main>
<main id="game" hidden>
  <header>
    <div><strong>梦境诊疗师</strong><span class="chapter"><span id="chapter-name">第一章</span><span id="progress"></span></span></div>
    <nav aria-label="游戏菜单"><button id="catalog">图鉴</button><button id="history">回顾</button><button id="save">存档</button><button id="load">读档</button><button id="home">主界面</button></nav>
  </header>
  <div id="stage" aria-busy="true"></div>
  <footer class="game-status"><span id="status" role="status"></span><button id="retry" type="button" hidden>重新加载</button></footer>
</main>
<dialog id="overlay"><div class="dialog-head"><h2 id="dialog-title"></h2><form method="dialog"><button>关闭</button></form></div><div id="dialog-content"></div></dialog>
</body>
</html>
